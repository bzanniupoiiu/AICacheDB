services:
  cache:
    build: .
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      AICACHEDB_PASSWORD: ${AICACHEDB_PASSWORD:?Set AICACHEDB_PASSWORD before starting}
    volumes:
      - cache-data:/data
    restart: unless-stopped
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
volumes:
  cache-data:
